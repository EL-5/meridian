# Tests the app, refreshes the economic calendar, and publishes the site to GitHub Pages.
# It runs on every push to main, every 30 minutes (to keep the calendar fresh), and on demand.
#
# The calendar is not committed to the repository: each run fetches it and publishes it with the site, so the history
# is not filled with a commit every 30 minutes. If the fetch fails (the feed is unofficial and can rate-limit), the
# run keeps the calendar from the last deployment and prints a warning, so the site is never left without news data
# because of one bad refresh, and a failure is visible in the run log rather than silent.
name: Test and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: |
          for t in tests/*.test.js tests/*.test.mjs; do
            echo "== $t"
            node "$t" || exit 1
          done

      - name: Keep the last calendar, then try to refresh it
        run: |
          curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/calendar.json" -o calendar.json || echo "No previous calendar to keep (this is normal on the first run)."
          node tools/update-calendar.mjs || echo "::warning::Calendar refresh failed. Keeping the previous calendar, if there was one."

      - name: Assemble the site (the app only, not the tests or tools)
        run: |
          mkdir _site
          cp index.html style.css app.js logic.js glossary.js journal.js sw.js manifest.webmanifest _site/
          cp -r icons _site/icons
          if [ -f calendar.json ]; then cp calendar.json _site/; fi
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
